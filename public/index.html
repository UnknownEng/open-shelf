<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="author" content="Maverick Technologies">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff4e0">
  <meta name="description" content="Open Shelf — Pakistan's book-sharing library. Borrow real books with credits, pass them on. Kitaab parho, aagay barhao.">
  <title>Open Shelf — every book deserves another reader</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" id="webfonts" media="print" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Noto+Nastaliq+Urdu:wght@400;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/genz.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="spotlight" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Open Shelf home">
      <span class="brand-mark"><span></span><span></span><span></span></span>
      <span class="brand-name" id="brandName">open shelf</span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/browse" data-nav="browse">Browse</a>
      <a href="#/shelf" data-nav="shelf">My shelf</a>
      <a href="#/#platforms" data-nav="platforms">For platforms</a>
      <a href="/admin" data-nav="admin" class="hidden" id="navAdmin">Console</a>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle light and dark theme" title="Theme">
        <svg viewBox="0 0 24 24" width="18" height="18"><path class="sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/><path class="moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <div class="bell-wrap hidden" id="bellWrap">
        <button class="icon-btn" id="bellBtn" aria-label="Notifications" aria-expanded="false" aria-controls="notifPanel">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="badge hidden" id="bellBadge">0</span>
        </button>
        <div class="popover" id="notifPanel" role="dialog" aria-label="Notifications"></div>
      </div>
      <a class="credit-pill hidden" id="creditPill" href="#/shelf" title="Your credits">
        <span class="coin">◈</span><b id="creditCount">0</b><span class="pill-label">credits</span>
      </a>
      <a class="shelf-target" id="shelfTarget" href="#/shelf" aria-label="My shelf">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 19.5V5a2 2 0 0 1 2-2h3v18H6a2 2 0 0 1-2-1.5ZM9 3h4v18H9zM14.5 4.2l3.6-1 4 16.2-3.6 1z"/></svg>
      </a>
      <button class="btn btn-ghost sm" id="signInBtn">Sign in</button>
      <button class="btn btn-primary sm magnetic" id="joinBtn"><span>Join free</span></button>
      <button class="avatar hidden" id="avatarBtn" aria-label="Account menu" aria-expanded="false" aria-controls="accountMenu"></button>
      <div class="popover menu" id="accountMenu"></div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Primary">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="#/browse" data-tab="browse"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Browse</span></a>
    <a href="#/shelf" data-tab="shelf"><svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h3v18H6a2 2 0 0 1-2-1.5ZM9 3h4v18H9zM14.5 4.2l3.6-1 4 16.2-3.6 1z"/></svg><span>Shelf</span></a>
    <a href="/admin" data-tab="admin" class="hidden" id="tabAdmin"><svg viewBox="0 0 24 24"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg><span>Console</span></a>
  </nav>

  <p class="made-by" id="madeBy">Made by <b>Maverick Technologies</b></p>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
